[server]
headless = true
enableStaticServing = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#284C38"
backgroundColor = "#F7F7F0"
secondaryBackgroundColor = "#EEF1E7"
textColor = "#243C32"
borderColor = "#DCE2D7"
font = "DM Sans"
headingFont = "Fraunces"
baseFontSize = 16
baseRadius = "14px"
buttonRadius = "full"
showWidgetBorder = true
headingFontSizes = ["44px", "38px", "27px", "22px", "18px", "16px"]
headingFontWeights = [500, 500, 500, 500, 500, 500]
chartCategoricalColors = ["#315C40", "#AD643D", "#768967", "#847560"]

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans.woff2"
weight = "100 1000"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/fraunces.woff2"
weight = "100 900"
